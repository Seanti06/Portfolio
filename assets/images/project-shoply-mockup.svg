  <rect x="0" y="0" width="600" height="42" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="24" y="26" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="-0.5">Shoply.</text>
  <text x="130" y="25" fill="#64748b" font-family="sans-serif" font-size="10">Apparel</text>
  <text x="190" y="25" fill="#64748b" font-family="sans-serif" font-size="10">Living</text>
  <text x="240" y="25" fill="#64748b" font-family="sans-serif" font-size="10">Accessories</text>
  <rect x="500" y="10" width="76" height="22" rx="11" fill="#0f172a"/>
  <text x="538" y="24" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Bag (3)</text>

  <!-- Banner Card -->
  <rect x="24" y="56" width="552" height="96" rx="8" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
  <text x="44" y="92" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Modern Goods &amp; Essentials</text>
  <text x="44" y="112" fill="#64748b" font-family="sans-serif" font-size="10.5">Crafted with precision for design-driven creators.</text>
  <rect x="460" y="86" width="96" height="32" rx="6" fill="#2563eb"/>
  <text x="508" y="106" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Explore →</text>

  <!-- Product Card 1 -->
  <rect x="24" y="166" width="168" height="174" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="0.8"/>
  <rect x="36" y="178" width="144" height="96" rx="6" fill="#e2e8f0"/>
  <!-- product shape icon -->
  <circle cx="108" cy="226" r="28" fill="#cbd5e1"/>
  <rect x="94" y="210" width="28" height="32" rx="4" fill="#94a3b8"/>
  <text x="36" y="294" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Studio Headphones</text>
  <text x="36" y="314" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="bold">$189.00</text>
  <text x="148" y="314" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">In stock</text>

  <!-- Product Card 2 -->
  <rect x="216" y="166" width="168" height="174" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="0.8"/>
  <rect x="228" y="178" width="144" height="96" rx="6" fill="#e2e8f0"/>
  <rect x="254" y="200" width="92" height="52" rx="4" fill="#94a3b8"/>
  <text x="228" y="294" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Minimal Desk Mat</text>
  <text x="228" y="314" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="bold">$49.00</text>
  <text x="340" y="314" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Top rated</text>

  <!-- Product Card 3 -->
  <rect x="408" y="166" width="168" height="174" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="0.8"/>
  <rect x="420" y="178" width="144" height="96" rx="6" fill="#e2e8f0"/>
  <rect x="450" y="196" width="84" height="60" rx="8" fill="#94a3b8"/>
  <text x="420" y="294" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Wireless Keyboard</text>
  <text x="420" y="314" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="bold">$129.00</text>
  <text x="532" y="314" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Sale</text>
