<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="#f8fafc" rx="10"/>
  <!-- Topbar -->
  <rect x="0" y="0" width="600" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="6" fill="#2563eb"/>
  <text x="38" y="25" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Finance Analytics</text>
  <rect x="474" y="10" width="102" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="525" y="24" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Live Metrics ▾</text>

  <!-- Stat Cards -->
  <rect x="24" y="56" width="168" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="38" y="76" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="500">Gross Volume</text>
  <text x="38" y="104" fill="#0f172a" font-family="sans-serif" font-size="19" font-weight="bold">$124,580</text>
  <rect x="136" y="90" width="44" height="18" rx="4" fill="#dcfce7"/>
  <text x="158" y="103" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+14.2%</text>

  <rect x="216" y="56" width="168" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="76" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="500">Net Profit</text>
  <text x="230" y="104" fill="#0f172a" font-family="sans-serif" font-size="19" font-weight="bold">$48,220</text>
  <rect x="328" y="90" width="44" height="18" rx="4" fill="#dcfce7"/>
  <text x="350" y="103" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+8.6%</text>

  <rect x="408" y="56" width="168" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="422" y="76" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="500">Active Clients</text>
  <text x="422" y="104" fill="#0f172a" font-family="sans-serif" font-size="19" font-weight="bold">3,842</text>
  <rect x="520" y="90" width="44" height="18" rx="4" fill="#eff6ff"/>
  <text x="542" y="103" fill="#1d4ed8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+320</text>

  <!-- Big Chart card -->
  <rect x="24" y="136" width="360" height="204" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="162" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Revenue Growth &amp; Projections</text>
  
  <line x1="40" y1="200" x2="364" y2="200" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="240" x2="364" y2="240" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="280" x2="364" y2="280" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="316" x2="364" y2="316" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Chart Path -->
  <path d="M 50 290 Q 110 240, 160 250 T 260 190 T 350 160 L 350 316 L 50 316 Z" fill="url(#areaGrad)"/>
  <path d="M 50 290 Q 110 240, 160 250 T 260 190 T 350 160" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Dot points -->
  <circle cx="160" cy="250" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="190" r="4" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="350" cy="160" r="5" fill="#2563eb"/>

  <!-- Right Donut Card -->
  <rect x="408" y="136" width="168" height="204" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="422" y="162" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Portfolio Mix</text>
  
  <!-- Donut chart -->
  <circle cx="492" cy="235" r="48" fill="none" stroke="#f1f5f9" stroke-width="18"/>
  <circle cx="492" cy="235" r="48" fill="none" stroke="#2563eb" stroke-width="18" stroke-dasharray="160 302" stroke-dashoffset="0"/>
  <circle cx="492" cy="235" r="48" fill="none" stroke="#06b6d4" stroke-width="18" stroke-dasharray="85 302" stroke-dashoffset="-160"/>
  <circle cx="492" cy="235" r="48" fill="none" stroke="#10b981" stroke-width="18" stroke-dasharray="57 302" stroke-dashoffset="-245"/>
  <text x="492" y="238" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">74%</text>
  <text x="492" y="252" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">SaaS</text>

  <!-- Donut Legend -->
  <rect x="430" y="306" width="8" height="8" rx="2" fill="#2563eb"/>
  <text x="444" y="314" fill="#64748b" font-family="sans-serif" font-size="9">Enterprise</text>
  <rect x="500" y="306" width="8" height="8" rx="2" fill="#10b981"/>
  <text x="514" y="314" fill="#64748b" font-family="sans-serif" font-size="9">SMB</text>
