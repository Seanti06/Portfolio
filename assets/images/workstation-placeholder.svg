<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#f1f5f9" rx="16"/>
  <!-- Subtle Grid lines -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#grid)" rx="16"/>
  
  <!-- Desk Monitor Graphic -->
  <rect x="180" y="90" width="240" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="195" y="105" width="210" height="120" rx="6" fill="#0f172a"/>
  <!-- Screen elements -->
  <circle cx="210" cy="118" r="4" fill="#ef4444"/>
  <circle cx="222" cy="118" r="4" fill="#f59e0b"/>
  <circle cx="234" cy="118" r="4" fill="#10b981"/>
  <rect x="248" y="115" width="70" height="6" rx="3" fill="#334155"/>
  <rect x="210" y="135" width="80" height="8" rx="4" fill="#2563eb"/>
  <rect x="210" y="152" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="210" y="165" width="110" height="6" rx="3" fill="#475569"/>
  <rect x="210" y="178" width="160" height="6" rx="3" fill="#334155"/>
  <!-- Stand -->
  <rect x="288" y="240" width="24" height="45" fill="#cbd5e1"/>
  <rect x="260" y="285" width="80" height="8" rx="4" fill="#94a3b8"/>
  
  <!-- Laptop beside -->
  <rect x="100" y="220" width="70" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="106" y="226" width="58" height="38" rx="2" fill="#1e293b"/>
  <polygon points="90,270 180,270 170,276 100,276" fill="#cbd5e1"/>
  
  <!-- Plant & Mug -->
  <rect x="440" y="235" width="18" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="485" cy="255" rx="14" ry="10" fill="#e2e8f0"/>
  <circle cx="485" cy="235" r="12" fill="#34d399" fill-opacity="0.8"/>
  <circle cx="478" cy="225" r="9" fill="#10b981" fill-opacity="0.9"/>
  <circle cx="492" cy="225" r="9" fill="#059669" fill-opacity="0.9"/>

  <!-- Centered Badge & Instructions -->
  <rect x="135" y="325" width="330" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))"/>
  <text x="300" y="345" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Workstation Photo Placeholder</text>
  <text x="300" y="358" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Replace with your setup in assets/images/hero-desk.jpg</text>
</svg>